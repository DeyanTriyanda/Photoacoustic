# Konfigurasi pelatihan SwinIR x2 untuk citra fotoakustik (grayscale)

seed: 42

model:
  task: classical_sr          # classical_sr | denoising
  img_size: 64                # patch training (kelipatan window_size)
  in_chans: 1
  embed_dim: 96
  depths: [6, 6, 6, 6]
  num_heads: [6, 6, 6, 6]
  window_size: 8
  mlp_ratio: 4.0
  upscale: 2
  img_range: 1.0

data:
  train_lq: data/train/lq
  train_hq: data/train/hq
  val_lq: data/val/lq
  val_hq: data/val/hq
  patch_size: 64

train:
  epochs: 100
  batch_size: 4
  num_workers: 2
  lr: 0.0002
  lr_min: 0.000001
  weight_decay: 0.0001
  amp: true
  grad_clip: 1.0
  pixel_loss: l1
  charbonnier: true
  fft_weight: 0.02            # penalti spektrum (cocok sinyal PA)
  checkpoint_dir: checkpoints
  log_dir: outputs/logs
